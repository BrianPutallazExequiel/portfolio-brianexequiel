name: Deploy Astro Site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"  # Habilita cache para pnpm (opcional pero recomendado)

      - name: Install pnpm
        run: npm install -g pnpm@latest  # Instala pnpm globalmente

      - name: Install dependencies
        run: pnpm install --frozen-lockfile  # Usa el lockfile para consistencia

      - name: Build Astro project
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # Ajusta si tu build está en otra carpeta